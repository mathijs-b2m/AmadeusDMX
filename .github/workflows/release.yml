name: Release

# Push a tag (git tag v0.2.0 && git push origin v0.2.0): the checks run, the Mac apps and the Windows apps are built
# with the engine inside, and a draft release with the disk images, the Windows installers and the update feeds
# (appcast.xml / appcast-link.xml for the Mac apps, appcast-windows.xml / appcast-link-windows.xml for Windows) is
# made on GitHub. You publish it there, after a look: from then on the apps out there find it (Sparkle and
# NetSparkle read releases/latest/download/…, the newest published release, not a prerelease).
# Run by hand (Actions › Release › Run workflow): the same builds, as workflow artifacts only.
#
# Secrets (mac/release-keys.sh makes them): SIGNING_P12_BASE64 + SIGNING_P12_PASSWORD (the signing certificate)
# and SPARKLE_PRIVATE_KEY (signs the updates, on both systems). Without them the apps are signed ad hoc and don't update.
# With DEVELOPER_ID_P12_BASE64 + DEVELOPER_ID_P12_PASSWORD (Apple's Developer ID Application certificate) the apps
# are signed with that instead, and notarized with NOTARY_KEY_P8 + NOTARY_KEY_ID (+ NOTARY_ISSUER_ID for a team
# key), an App Store Connect API key: Gatekeeper then opens them without asking (mac/README.md).
# Windows (windows/README.md): Azure Trusted Signing with WINDOWS_SIGN_ENDPOINT, WINDOWS_SIGN_ACCOUNT,
# WINDOWS_SIGN_PROFILE, WINDOWS_SIGN_TENANT_ID, WINDOWS_SIGN_CLIENT_ID, WINDOWS_SIGN_CLIENT_SECRET, or a
# certificate: WINDOWS_PFX_BASE64 + WINDOWS_PFX_PASSWORD. Without either the Windows apps are unsigned.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # the draft release

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  mac:
    needs: checks
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the build number is the commit count
      - uses: astral-sh/setup-uv@v6
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.$(git rev-list --count HEAD)"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Release keys
        env:
          P12: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DEVID_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          keys="$RUNNER_TEMP/keys"; mkdir -p "$keys"; chmod 700 "$keys"
          # Developer ID: signed so Gatekeeper knows us, notarized when the API key is there too
          if [ -n "$DEVID_P12" ]; then
            echo "$DEVID_P12" | base64 --decode > "$keys/developer-id.p12"
            printf %s "$DEVID_P12_PASSWORD" > "$keys/developer-id-password.txt"
            echo "DEVID_P12=$keys/developer-id.p12" >> "$GITHUB_ENV"
            echo "DEVID_PASSWORD_FILE=$keys/developer-id-password.txt" >> "$GITHUB_ENV"
            if [ -n "$NOTARY_P8" ]; then
              printf '%s\n' "$NOTARY_P8" > "$keys/notary-key.p8"
              { echo "NOTARY_KEY_FILE=$keys/notary-key.p8"; echo "NOTARY_KEY_ID=$NOTARY_ID"
                echo "NOTARY_ISSUER=$NOTARY_ISSUER_ID"; } >> "$GITHUB_ENV"
            else
              echo "::warning::No NOTARY_KEY_P8 in the secrets: signed with Developer ID, not notarized"
            fi
          fi
          # updates need both: the same signature on every release, and updates signed with the key
          if [ -z "$P12" ] || [ -z "$SPARKLE_KEY" ]; then
            echo "::warning::No release keys in the secrets: signed ad hoc, without updates"
            exit 0
          fi
          echo "$P12" | base64 --decode > "$keys/signing.p12"
          printf %s "$P12_PASSWORD" > "$keys/signing-password.txt"
          printf %s "$SPARKLE_KEY" > "$keys/sparkle-private-key.txt"
          {
            echo "SIGN_P12=$keys/signing.p12"
            echo "SIGN_PASSWORD_FILE=$keys/signing-password.txt"
            echo "SPARKLE_KEY_FILE=$keys/sparkle-private-key.txt"
            echo "FEED_URL=https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml"
          } >> "$GITHUB_ENV"
      - name: Build (engine inside)
        working-directory: mac
        run: ./build-app.sh --release --dmg
      - name: Name the disk images
        working-directory: mac/build
        run: |
          mv AmadeusDMX.dmg "AmadeusDMX-$VERSION.dmg"
          mv AmadeusLink.dmg "AmadeusLink-$VERSION.dmg"
          shasum -a 256 *.dmg > SHA256SUMS.txt
      - name: Update feeds
        if: startsWith(github.ref, 'refs/tags/v') && env.SPARKLE_KEY_FILE != ''
        run: |
          # one feed per app: appcast.xml (Amadeus DMX), appcast-link.xml (Amadeus Link)
          feed() {
            mkdir -p "$RUNNER_TEMP/feed-$1"
            cp "mac/build/$1-$VERSION.dmg" "$RUNNER_TEMP/feed-$1/"
            mac/.build/artifacts/sparkle/Sparkle/bin/generate_appcast --ed-key-file "$SPARKLE_KEY_FILE" \
              --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
              --full-release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
              -o "mac/build/$2" "$RUNNER_TEMP/feed-$1"
          }
          feed AmadeusDMX appcast.xml
          feed AmadeusLink appcast-link.xml
      - uses: actions/upload-artifact@v4
        with:
          name: amadeus-dmx-${{ env.VERSION }}
          path: |
            mac/build/*.dmg
            mac/build/SHA256SUMS.txt
            mac/build/appcast*.xml

  windows:
    needs: checks
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the build number is the commit count
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Version
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) } else { $v = "0.0.0-dev.$(git rev-list --count HEAD)" }
          "VERSION=$v" >> $env:GITHUB_ENV
      - name: Release keys
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SIGN_ENDPOINT: ${{ secrets.WINDOWS_SIGN_ENDPOINT }}
          PFX: ${{ secrets.WINDOWS_PFX_BASE64 }}
        run: |
          # code signing: Azure Trusted Signing, else a certificate of our own (.pfx), else none
          if ($env:SIGN_ENDPOINT) {
            "SIGNING=azure" >> $env:GITHUB_ENV
          } elseif ($env:PFX) {
            $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX))
            "SIGNING=pfx" >> $env:GITHUB_ENV
            "WINDOWS_PFX=$pfx" >> $env:GITHUB_ENV
          } else {
            "::warning::No Windows signing secrets (WINDOWS_SIGN_* or WINDOWS_PFX_BASE64): unsigned, SmartScreen warns when people run the installer"
          }
          # updates: signed with the same key as the Mac apps'
          if ($env:SPARKLE_KEY) {
            "FEED_URL=https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/appcast-windows.xml" >> $env:GITHUB_ENV
          } else {
            "::warning::No SPARKLE_PRIVATE_KEY in the secrets: the Windows apps don't update"
          }
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: VirtualDJ plugin
        run: |
          if (Test-Path vdj/build.ps1) { ./vdj/build.ps1 } else { "::warning::No vdj/build.ps1: built without the VirtualDJ plugin" }
      - name: Build (engine inside)
        run: ./windows/build.ps1 -Release -Version $env:VERSION
      - name: What to sign
        if: env.SIGNING != ''
        run: |
          # the apps and the engine's Python (and the launchers the optional packs' environment copies)
          $files = @('AmadeusDMX\AmadeusDMX.exe', 'AmadeusLink\AmadeusLink.exe', 'AmadeusDMX\runtime\python.exe',
            'AmadeusDMX\runtime\pythonw.exe', 'AmadeusDMX\runtime\Lib\venv\scripts\nt\venvlauncher.exe',
            'AmadeusDMX\runtime\Lib\venv\scripts\nt\venvwlauncher.exe') |
            ForEach-Object { Join-Path $env:GITHUB_WORKSPACE "windows\build\$_" } | Where-Object { Test-Path $_ }
          "SIGN_FILES=$($files -join ',')" >> $env:GITHUB_ENV
      - name: Sign the apps (Azure Trusted Signing)
        if: env.SIGNING == 'azure'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.WINDOWS_SIGN_TENANT_ID }}
          azure-client-id: ${{ secrets.WINDOWS_SIGN_CLIENT_ID }}
          azure-client-secret: ${{ secrets.WINDOWS_SIGN_CLIENT_SECRET }}
          endpoint: ${{ secrets.WINDOWS_SIGN_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.WINDOWS_SIGN_ACCOUNT }}
          certificate-profile-name: ${{ secrets.WINDOWS_SIGN_PROFILE }}
          files: ${{ env.SIGN_FILES }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Sign the apps (certificate)
        if: env.SIGNING == 'pfx'
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: ./windows/installer/sign.ps1 -Pfx $env:WINDOWS_PFX -Password $env:PFX_PASSWORD ($env:SIGN_FILES -split ',')
      - name: Installers
        run: |
          ./windows/build.ps1 -Installer -NoBuild -Version $env:VERSION
          $files = Get-ChildItem windows/build/*-Setup-*.exe | ForEach-Object FullName
          "INSTALLERS=$($files -join ',')" >> $env:GITHUB_ENV
      - name: Sign the installers (Azure Trusted Signing)
        if: env.SIGNING == 'azure'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.WINDOWS_SIGN_TENANT_ID }}
          azure-client-id: ${{ secrets.WINDOWS_SIGN_CLIENT_ID }}
          azure-client-secret: ${{ secrets.WINDOWS_SIGN_CLIENT_SECRET }}
          endpoint: ${{ secrets.WINDOWS_SIGN_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.WINDOWS_SIGN_ACCOUNT }}
          certificate-profile-name: ${{ secrets.WINDOWS_SIGN_PROFILE }}
          files: ${{ env.INSTALLERS }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Sign the installers (certificate)
        if: env.SIGNING == 'pfx'
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: ./windows/installer/sign.ps1 -Pfx $env:WINDOWS_PFX -Password $env:PFX_PASSWORD ($env:INSTALLERS -split ',')
      - name: Checksums
        working-directory: windows/build
        run: |
          $sums = Get-ChildItem *-Setup-*.exe | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path -Leaf $_.Path)" }
          [IO.File]::WriteAllText("$PWD/SHA256SUMS-windows.txt", ($sums -join "`n") + "`n")
      - name: Update feeds
        if: startsWith(github.ref, 'refs/tags/v') && env.FEED_URL != ''
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # one feed per app, each with its .signature: appcast-windows.xml (Amadeus DMX), appcast-link-windows.xml (Amadeus Link)
          $build = git rev-list --count HEAD
          $prefix = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/"
          $notes = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME"
          foreach ($f in @(@('AmadeusDMX', 'appcast-windows.xml', 'Amadeus DMX'), @('AmadeusLink', 'appcast-link-windows.xml', 'Amadeus Link'))) {
            uv run windows/installer/appcast.py feed "windows/build/$($f[0])-Setup-$env:VERSION.exe" -o "windows/build/$($f[1])" `
              --version $env:VERSION --build $build --url-prefix $prefix --notes-url $notes --title $f[2]
          }
      - uses: actions/upload-artifact@v4
        with:
          name: amadeus-dmx-windows-${{ env.VERSION }}
          path: |
            windows/build/*-Setup-*.exe
            windows/build/SHA256SUMS-windows.txt
            windows/build/appcast*.xml
            windows/build/appcast*.xml.signature

  release:
    needs: [mac, windows]
    # a Windows build that fails doesn't hold back the Mac release: the draft then has the Mac apps only
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.mac.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # the release notes (.github/release-notes.md)
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          pattern: amadeus-dmx-*
          path: dist
          merge-multiple: true
      - name: Draft release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # one checksum file for everything
          if [ -f SHA256SUMS-windows.txt ]; then cat SHA256SUMS-windows.txt >> SHA256SUMS.txt && rm SHA256SUMS-windows.txt
          else echo "::warning::No Windows build: the draft release has the Mac apps only"; fi
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --notes-file ../.github/release-notes.md --title "Amadeus DMX $VERSION" \
            $([[ "$VERSION" == *-* ]] && echo --prerelease) \
            *.dmg $(ls *.exe 2>/dev/null) SHA256SUMS.txt $(ls appcast*.xml appcast*.xml.signature 2>/dev/null)
