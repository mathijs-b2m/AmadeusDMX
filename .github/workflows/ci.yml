name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]  # the golden test runs where it was recorded (Apple Silicon)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install (pinned, so the golden hashes are comparable)
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check decisive tests
          ruff format --check decisive tests
      - name: Test
        run: pytest -q

  mac-app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: mac
        run: swift build -c release
