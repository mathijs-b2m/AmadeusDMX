name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # a release runs the same checks first (release.yml)

jobs:
  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]  # the golden test runs where it was recorded (Apple Silicon)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip  # the downloads, not the environment: an install stays exact
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
      - name: Install (pinned, so the golden hashes are comparable)
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check amadeus tests
          ruff format --check amadeus tests
      - name: Test
        run: pytest -q -n auto  # one worker per core (pytest-xdist): the analysis tests are single-threaded

  windows:  # the engine on Windows (the golden test skips itself: it was recorded on Apple Silicon)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
      - name: Install (pinned, as the Windows app ships them)
        run: |
          pip install -r requirements-app.txt
          pip install -e ".[dev]"
      - name: Test
        env:
          PYTHONUTF8: "0"  # as the app runs it: everything that reads or writes text must say UTF-8 itself
        run: pytest -q -n auto

  mac-app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: mac
        run: swift build -c release
      - name: Test
        working-directory: mac
        run: swift test
