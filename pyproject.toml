[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus-dmx"
version = "0.1.0"
description = "AI-directed sound-to-light: analyses a DJ's tracks, decides a light show per phrase, drives DMX."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2",
    "scipy>=1.14",
    "soundfile>=0.13",
    "sounddevice>=0.5",
    "websockets>=14",
    "pypdf>=6",  # venue PDFs for the import (amadeus/rig/importer/pdf.py)
]

[project.optional-dependencies]
openai = ["openai>=2"]
usb = ["pyserial>=3.5"]
mixxx = ["python-rtmidi>=1.5; sys_platform != 'win32'"]  # Mixxx: its controller script talks MIDI (Windows: WinMM)
djay = [  # djay: its window (Accessibility / UI Automation), and Ableton Link
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "aalink>=0.2",
]
streamed = ["yt-dlp[default]>=2026.8.19"]  # streamed tracks (Spotify in djay): a local copy to analyse
link = ["aalink>=0.2"]  # Ableton Link: beat phase from DJ software synced to it
remote = ["zeroconf>=0.130; sys_platform == 'win32'"]  # Amadeus Link by name without Bonjour (macOS: dns-sd)
ml = ["beat-this>=1.1", "demucs>=4.1", "torch>=2.6", "torchaudio>=2.6", "onnxruntime>=1.24"]
dev = ["pytest>=8", "pytest-xdist>=3.8", "ruff>=0.9"]

[project.scripts]
amadeus = "amadeus.cli:main"

[tool.setuptools.packages.find]
include = ["amadeus*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["web/vendor", "vdj/sdk", "audio_downloader"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E731",  # small lambdas as local helpers read fine
    "SIM108",  # ternaries are not always clearer
    "SIM105",  # try/except/pass is as clear as contextlib.suppress
    "B905",  # zip(strict=) everywhere would only add noise: the inputs are built side by side
]

[tool.ruff.lint.isort]
known-first-party = ["amadeus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"amadeus.show.sources" = ["*.json"]
"amadeus.mcp" = ["guide.md"]
